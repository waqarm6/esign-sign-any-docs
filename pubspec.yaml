name: esign_doc_pro
description: A professional cross-platform document signing workspace.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: 2.3.2
  file_picker: 8.1.2
  image: 4.10.1
  paper_document_scanner: 0.1.3
  in_app_purchase: 3.3.1
  in_app_purchase_android: 0.5.3
  in_app_purchase_platform_interface: 1.4.1
  in_app_purchase_storekit: 0.4.13
  google_fonts: ^8.2.1
  screen_security: ^1.1.2
  path_provider: ^2.1.6
  pdf: ^3.11.3
  printing: ^5.14.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/onboarding/paper_backdrop.png
    - assets/secure_signature_icon.png
